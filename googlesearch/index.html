<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="logo">Google <span class="text-primary">Search</span></div>

    <form action="https://www.google.com/search">
        <input type="text" name="q" placeholder="Zadejte hledaný výraz...">
        <input type="submit" value="Google Search">
    </form>

    <p>Pomocí tohoto jednoduchého vyhledávacího formuláře můžete vyhledávat na Googlu přímo z této stránky.</p>
</div>

</body>
</html>
